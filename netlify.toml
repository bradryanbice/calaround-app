# Netlify build config. Mirrors royalrumblestats.com, which is the closest
# sibling: same Hugo version, no dart-sass step (this site's one stylesheet is
# plain CSS through Hugo's own pipeline, not SCSS — do not copy bradbice.com's
# dart-sass download in here unless that changes).
[build]
  publish = "public"
  command = "hugo --gc --minify"

  # ---------------------------------------------------------------------------
  # THE BUILD-SKIP RULE IS DISABLED. Do not re-enable it without reading this.
  #
  # It carried TWO independent defects. The guard on the commented-out line
  # below fixes the first. Nothing fixes the second except not running the rule,
  # which is why it is off.
  #
  # DEFECT 1 — empty $CACHED_COMMIT_REF. `git diff --quiet` exits 0 on no
  # difference and Netlify reads exit 0 as "skip", so every failure path must
  # exit NON-zero to fail safe by building. On a first build, or after a cache
  # clear, $CACHED_COMMIT_REF is empty; UNQUOTED it vanishes from the command
  # line, leaving
  #     git diff --quiet $COMMIT_REF -- .
  # which compares that commit against the WORKING TREE. On a clean checkout
  # that is no difference, exit 0, SKIP — no site published, reported as a
  # skipped build rather than a failure. The `[ -n ... ] &&` guard short-circuits
  # to exit 1 there, and the quotes stop the same collapse recurring. Verified
  # against this repo, all five cases: empty ref → 1 BUILD, unknown ref → 128
  # BUILD, content change → 1 BUILD, README-only → 0 SKIP, identical refs → 0
  # SKIP. The bare unguarded form is what Netlify's own docs show.
  #
  # DEFECT 2 — a merge whose tree was already previewed. This one the guard does
  # NOT cover: the ref is set and the diff is honestly empty. It took
  # headedapp.com down on 2026-08-29 (see that repo's netlify.toml). main had not
  # moved while the branch was open, so the merge commit's tree was
  # BYTE-IDENTICAL to the branch tip a deploy preview had already built.
  # $CACHED_COMMIT_REF for the production build therefore pointed at that
  # PREVIEW; the rule diffed preview vs merge, found no change, and skipped.
  # Netlify reports a skipped build as "Canceled".
  #
  # The rule was correct that no content had changed, and wrong anyway: it
  # reasons about CONTENT when the thing that matters is CONTEXT — a deploy
  # preview is not a production publish. On headed, production had never
  # published, so the failure mode was an outage. Here it is milder and still
  # unacceptable: calaround.app IS published and serving, so a wrongly-skipped
  # merge leaves the PREVIOUS deploy up and the merged changes silently never go
  # live. That is precisely the "stale site" this block used to claim was
  # impossible. main not moving while a branch is open is the normal case on a
  # solo-maintained site, so this is a routine path, not a corner.
  #
  # Every push now builds, which is Netlify's default and costs a few seconds
  # per deploy. The rule only ever saved fixed overhead on no-op pushes.
  #
  # Before reinstating: re-enable on a branch, then confirm a production build
  # still RUNS after a merge whose tree was already previewed — that is the exact
  # case that broke. Reinstate the guarded form below, never the bare one.
  # ---------------------------------------------------------------------------
  #
  # Skip the deploy when nothing Hugo reads has changed. None of the excluded
  # paths is a Hugo input: hugo.toml declares no custom module mounts, so Hugo
  # reads content/, data/, layouts/, assets/, static/, themes/, i18n/,
  # archetypes/ and hugo.toml. netlify.toml itself is deliberately NOT excluded —
  # headers and redirects are applied at deploy time, so a change to them needs a
  # deploy.
  #
  # ignore = '''[ -n "$CACHED_COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ':(exclude).github' ':(exclude)README.md' ':(exclude).gitignore' '''

[build.environment]
  # Pin the toolchain so Netlify builds match local builds.
  HUGO_VERSION = "0.165.0"
  TZ = "America/New_York"

# Deploy previews (pull requests) and branch deploys build against their own
# generated URL so links and assets resolve on the preview host.
[context.deploy-preview]
  command = "hugo --gc --minify --baseURL $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify --baseURL $DEPLOY_PRIME_URL"

# Keep one canonical hostname. Netlify issues certificates for both, but serving
# the same content on two hosts splits SEO.
[[redirects]]
  from = "https://www.calaround.app/*"
  to = "https://calaround.app/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Deliberately NO Cache-Control rule for the HTML. royalrumblestats.com carries a
# `for = "/*.html"` rule, but header rules match the REQUEST path and this site
# publishes pretty URLs — the request is `/support/`, never `/support/index.html`
# — so copying that rule here would match nothing. Netlify's own default for
# HTML is already `public, max-age=0, must-revalidate`, which is what the rule
# was asking for. Confirm against the response headers on a deploy preview
# rather than trusting this comment.

# Everything published to /css/ carries a content hash in its filename
# (baseof.html fingerprints it), so a change produces a NEW url and a cached
# copy of the old one can never be stale. That is the whole precondition for
# `immutable` — an UNfingerprinted file published into /css/ would be a
# correctness bug, pinned in visitors' caches for a year with no way to bust it.
# Anything in static/ is copied verbatim and gets none of that hashing, so it
# must not be published to this path.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The screenshots are content-stable (see README: deliberately not downscaled,
# replaced rather than edited) but carry no content hash, so they get a long
# max-age WITHOUT `immutable` — a replaced image revalidates rather than being
# pinned.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
